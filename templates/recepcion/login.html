<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ingreso · Recepción de Planta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F5F7F4;
            --ink-primary: #112218;
            --ink-secondary: #3F5246;
            --border-strong: #BFCBC0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-canvas);
            color: var(--ink-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-card {
            background: #FFFFFF;
            border: 1px solid #DCE3DC;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(17, 34, 24, 0.08);
        }
        .login-header {
            background: linear-gradient(145deg, #112218 0%, #14532D 100%);
            color: #FFFFFF;
            padding: 24px 20px;
            text-align: center;
        }
        .badge-qc {
            width: 44px;
            height: 44px;
            border-radius: 11px;
            background: #22C55E;
            color: #FFFFFF;
            font-weight: 800;
            font-size: 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .login-body {
            padding: 22px 20px;
        }
        .field-group {
            margin-bottom: 16px;
        }
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--ink-secondary);
            margin-bottom: 6px;
        }
        .field-input {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1.5px solid var(--border-strong);
            border-radius: 8px;
            font-size: 15px;
            background: #FFFFFF;
            color: var(--ink-primary);
        }
        .field-input:focus {
            outline: none;
            border-color: #166534;
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.15);
        }
        .btn-submit {
            width: 100%;
            height: 48px;
            background: #16A34A;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="badge-qc">QC</div>
            <h1 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 800;">Recepción y Calidad de Planta</h1>
            <p style="font-size: 12.5px; color: #A7F3D0; margin-top: 4px;">Acceso seguro al sistema</p>
        </div>
        <div class="login-body">
            {% if error %}
            <div style="background: #FFF1F2; border: 1px solid #FDA4AF; color: #9F1239; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 14px;">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="post" autocomplete="off">
                {% csrf_token %}
                <div class="field-group">
                    <label class="field-label" for="id-username">Usuario</label>
                    <input type="text" name="username" id="id-username" class="field-input"
                        required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
                </div>
                <div class="field-group">
                    <label class="field-label" for="id-password">Contraseña</label>
                    <input type="password" name="password" id="id-password" class="field-input"
                        required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-submit">Ingresar →</button>
            </form>
        </div>
    </div>
</body>
</html>
