services:
  db:
    image: postgres:16-alpine
    container_name: calidad_planta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-calidad}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_calidad_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-calidad}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: calidad_planta_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      APP_PORT: ${APP_PORT:-8420}
      APP_HOST: 0.0.0.0
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8420}:8420"
    volumes:
      - ./cosechas:/app/cosechas
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_calidad_data:
